!
version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R28
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!


!
ip dhcp excluded-address 10.30.10.1 10.30.10.99
ip dhcp excluded-address 10.30.10.201 10.30.10.254
ip dhcp excluded-address 10.30.20.1 10.30.20.99
ip dhcp excluded-address 10.30.20.201 10.30.20.254
!
ip dhcp pool SITE30-VLAN10
 network 10.30.10.0 255.255.255.0
 default-router 10.30.10.1 
!
ip dhcp pool SITE30-VLAN20
 network 10.30.20.0 255.255.255.0
 default-router 10.30.20.1 
!
!
!
no ip domain lookup
ip domain name corp.lab
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
username labadmin privilege 15 secret 5 <REDACTED>
!
redundancy
!
!
track 25 ip sla 25 reachability
 delay down 5 up 10
!
track 26 ip sla 26 reachability
 delay down 5 up 10
!
ip ssh time-out 60
ip ssh version 2
! 
!
crypto ikev2 proposal CORP-IKEV2-PROP 
 encryption aes-cbc-256
 integrity sha256
 group 14
!
crypto ikev2 policy CORP-IKEV2-POLICY 
 match fvrf any
 proposal CORP-IKEV2-PROP
!
crypto ikev2 keyring CORP-KEYS
 peer CORP
  address 10.255.100.0 255.255.255.0
  pre-shared-key <REDACTED>
 !
!
!
crypto ikev2 profile CORP-IKEV2
 match fvrf any
 match identity remote address 10.255.100.0 255.255.255.0 
 identity local address 10.255.100.28
 authentication remote pre-share
 authentication local pre-share
 keyring local CORP-KEYS
 dpd 10 3 periodic
!
!
!
crypto ipsec transform-set CORP-TS esp-aes 256 esp-sha256-hmac 
 mode transport
!
crypto ipsec profile CORP-IPSEC
 set transform-set CORP-TS 
 set pfs group14
 set ikev2-profile CORP-IKEV2
!
!
!
!
!
!
!
interface Loopback0
 no shutdown
 description MANAGEMENT_ROUTER_ID
 ip address 10.255.0.28 255.255.255.255
!
interface Loopback100
 no shutdown
 description VPN_NBMA_UNDERLAY
 ip address 10.255.100.28 255.255.255.255
!
interface Tunnel100
 no shutdown
 description CORP_DMVPN_PHASE3
 bandwidth 10000
 ip address 10.253.100.28 255.255.255.0
 no ip redirects
 ip mtu 1400
 ip nhrp authentication <REDACTED>
 ip nhrp map 10.253.100.1 10.255.100.15
 ip nhrp map multicast 10.255.100.15
 ip nhrp network-id 100
 ip nhrp holdtime 300
 ip nhrp nhs 10.253.100.1
 ip nhrp shortcut
 ip tcp adjust-mss 1360
 delay 1000
 tunnel source Loopback100
 tunnel mode gre multipoint
 tunnel key 100
 tunnel protection ipsec profile CORP-IPSEC
!
interface Ethernet0/0
 no shutdown
 description TO_R26_E0_1
 ip address 10.254.0.54 255.255.255.252
 ip access-group CORP-NO-CLEAR out
 ip nat outside
 ip virtual-reassembly in
!
interface Ethernet0/1
 no shutdown
 description TO_R25_E0_3
 ip address 10.254.0.50 255.255.255.252
 ip access-group CORP-NO-CLEAR out
 ip nat outside
 ip virtual-reassembly in
!
interface Ethernet0/2
 no shutdown
 description TRUNK_TO_SW29_E0_2
 no ip address
!
interface Ethernet0/2.10
 no shutdown
 description VLAN_10_TO_SW29
 encapsulation dot1Q 10
 ip address 10.30.10.1 255.255.255.0
 ip nat inside
 ip virtual-reassembly in
 ip policy route-map CHOK-PBR
!
interface Ethernet0/2.20
 no shutdown
 description VLAN_20_TO_SW29
 encapsulation dot1Q 20
 ip address 10.30.20.1 255.255.255.0
 ip nat inside
 ip virtual-reassembly in
 ip policy route-map CHOK-PBR
!
interface Ethernet0/2.99
 no shutdown
 description VLAN_99_TO_SW29
 encapsulation dot1Q 99
 ip address 10.30.99.1 255.255.255.0
 ip nat inside
 ip virtual-reassembly in
!
interface Ethernet0/2.1000
 no shutdown
 description UNUSED_NATIVE_VLAN
 encapsulation dot1Q 1000 native
!
interface Ethernet0/3
 no shutdown
 no ip address
 shutdown
!
interface Ethernet1/0
 no shutdown
 no ip address
 shutdown
!
interface Ethernet1/1
 no shutdown
 no ip address
 shutdown
!
interface Ethernet1/2
 no shutdown
 no ip address
 shutdown
!
interface Ethernet1/3
 no shutdown
 no ip address
 shutdown
!
!
router eigrp CORP-VPN
 !
 address-family ipv4 unicast autonomous-system 65010
  !
  af-interface default
   passive-interface
  exit-af-interface
  !
  af-interface Tunnel100
   summary-address 10.30.0.0 255.255.0.0
   no passive-interface
  exit-af-interface
  !
  topology base
  exit-af-topology
  network 10.30.0.0 0.0.255.255
  network 10.253.100.0 0.0.0.255
  eigrp router-id 10.255.100.28
 exit-address-family
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip nat inside source route-map PAT-E0_0 interface Ethernet0/0 overload
ip nat inside source route-map PAT-E0_1 interface Ethernet0/1 overload
ip route 0.0.0.0 0.0.0.0 Ethernet0/1 10.254.0.49 track 25
ip route 0.0.0.0 0.0.0.0 Ethernet0/0 10.254.0.53 10 track 26
ip route 10.10.0.0 255.255.0.0 Null0 250
ip route 10.20.0.0 255.255.0.0 Null0 250
ip route 10.255.0.25 255.255.255.255 Ethernet0/1 10.254.0.49
ip route 10.255.0.25 255.255.255.255 Null0 254
ip route 10.255.0.26 255.255.255.255 Ethernet0/0 10.254.0.53
ip route 10.255.0.26 255.255.255.255 Null0 254
!
ip access-list standard CHOK-VLAN10
 permit 10.30.10.0 0.0.0.255
ip access-list standard CHOK-VLAN20
 permit 10.30.20.0 0.0.0.255
ip access-list standard SSH-ADMIN
 permit 10.10.255.15
 permit 10.10.10.0 0.0.0.255
 permit 10.20.10.0 0.0.0.255
 permit 10.30.10.0 0.0.0.255
!
ip access-list extended CHOK-LOCAL
 permit ip any 10.30.10.0 0.0.0.255
 permit ip any 10.30.20.0 0.0.0.255
 permit ip any 10.30.99.0 0.0.0.255
 permit ip any host 10.255.0.28
 permit ip any 10.10.0.0 0.0.255.255
 permit ip any 10.20.0.0 0.0.255.255
 permit ip any 10.30.0.0 0.0.255.255
ip access-list extended CORP-NAT4
 deny   ip 10.30.0.0 0.0.255.255 10.10.0.0 0.0.255.255
 deny   ip 10.30.0.0 0.0.255.255 10.20.0.0 0.0.255.255
 deny   ip 10.30.0.0 0.0.255.255 10.30.0.0 0.0.255.255
 permit ip 10.30.0.0 0.0.255.255 any
ip access-list extended CORP-NO-CLEAR
 deny   ip any 10.10.0.0 0.0.255.255
 deny   ip any 10.20.0.0 0.0.255.255
 deny   ip any 10.30.0.0 0.0.255.255
 permit ip any any
!
ip sla 25
 icmp-echo 10.255.0.25 source-interface Ethernet0/1
 threshold 500
 timeout 1000
 frequency 5
ip sla schedule 25 life forever start-time now
ip sla 26
 icmp-echo 10.255.0.26 source-interface Ethernet0/0
 threshold 500
 timeout 1000
 frequency 5
ip sla schedule 26 life forever start-time now
!
route-map CHOK-PBR deny 5
 match ip address CHOK-LOCAL
!
route-map CHOK-PBR permit 10
 match ip address CHOK-VLAN10
 set ip next-hop verify-availability 10.254.0.49 10 track 25
 set ip next-hop verify-availability 10.254.0.53 20 track 26
!
route-map CHOK-PBR permit 20
 match ip address CHOK-VLAN20
 set ip next-hop verify-availability 10.254.0.53 10 track 26
 set ip next-hop verify-availability 10.254.0.49 20 track 25
!
route-map CHOK-PBR permit 100
!
route-map PAT-E0_0 permit 10
 match ip address CORP-NAT4
 match interface Ethernet0/0
!
route-map PAT-E0_1 permit 10
 match ip address CORP-NAT4
 match interface Ethernet0/1
!
!
!
ipv6 access-list SSH-BLOCK-V6
 deny ipv6 any any
!
control-plane
!
!
!
!
!
!
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 access-class SSH-ADMIN in
 ipv6 access-class SSH-BLOCK-V6 in
 login local
 transport input ssh
!
ntp server 10.10.255.15
!
end

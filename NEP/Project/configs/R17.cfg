!
version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R17
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!


!
!
!
!
no ip domain lookup
ip domain name corp.lab
ip cef
ipv6 unicast-routing
ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
username labadmin privilege 15 secret 5 <REDACTED>
!
redundancy
!
!
ip ssh time-out 60
ip ssh version 2
! 
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 no shutdown
 description MANAGEMENT_ROUTER_ID
 ip address 10.20.255.17 255.255.255.255
 ipv6 address FD10:20:0:FFFF::17/128
!
interface Ethernet0/0
 no shutdown
 description TO_SW9_E0_3
 ip address 10.20.0.9 255.255.255.252
 ipv6 address FD10:20:0:3::1/64
!
interface Ethernet0/1
 no shutdown
 description TO_R18_E0_1
 ip address 10.20.0.6 255.255.255.252
 ipv6 address FD10:20:0:2::2/64
!
interface Ethernet0/2
 no shutdown
 description TO_SW10_E1_0
 ip address 10.20.0.13 255.255.255.252
 ipv6 address FD10:20:0:4::1/64
!
interface Ethernet0/3
 no shutdown
 no ip address
 shutdown
!
!
router eigrp SPB
 !
 address-family ipv4 unicast autonomous-system 2042
  !
  af-interface default
   passive-interface
  exit-af-interface
  !
  af-interface Ethernet0/1
   summary-address 10.20.0.0 255.255.0.0
   no passive-interface
  exit-af-interface
  !
  af-interface Ethernet0/0
   no passive-interface
  exit-af-interface
  !
  af-interface Ethernet0/2
   no passive-interface
  exit-af-interface
  !
  topology base
   distribute-list prefix SPB-SUMMARY4 out Ethernet0/1
  exit-af-topology
  network 10.20.0.0 0.0.255.255
  eigrp router-id 10.20.255.17
 exit-address-family
 !
 address-family ipv6 unicast autonomous-system 2042
  !
  af-interface default
   passive-interface
  exit-af-interface
  !
  af-interface Ethernet0/1
   summary-address FD10:20::/48
   no passive-interface
  exit-af-interface
  !
  af-interface Ethernet0/0
   no passive-interface
  exit-af-interface
  !
  af-interface Ethernet0/2
   no passive-interface
  exit-af-interface
  !
  topology base
   distribute-list prefix-list SPB-SUMMARY6 out Ethernet0/1
  exit-af-topology
  eigrp router-id 10.20.255.17
 exit-address-family
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
ip access-list standard SSH-ADMIN
 permit 10.10.255.15
 permit 10.10.10.0 0.0.0.255
 permit 10.20.10.0 0.0.0.255
 permit 10.30.10.0 0.0.0.255
!
!
ip prefix-list SPB-SUMMARY4 seq 10 permit 10.20.0.0/16
!
!
ipv6 prefix-list SPB-SUMMARY6 seq 10 permit FD10:20::/48
!
!
ipv6 access-list SSH-BLOCK-V6
 deny ipv6 any any
!
control-plane
!
!
!
!
!
!
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 access-class SSH-ADMIN in
 ipv6 access-class SSH-BLOCK-V6 in
 login local
 transport input ssh
!
ntp server 10.10.255.15
!
end

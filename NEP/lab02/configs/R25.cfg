
!
version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R25
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!


!
!
!
!
no ip domain lookup
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
redundancy
!
!
track 28 ip sla 28 reachability
 delay down 5 up 10
!
track 29 ip sla 29 reachability
 delay down 5 up 10
!
! 
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 no shutdown
 description MANAGEMENT_ROUTER_ID
 ip address 10.255.0.25 255.255.255.255
!
interface Ethernet0/0
 no shutdown
 description TO_R23_E0_1
 ip address 10.254.0.22 255.255.255.252
!
interface Ethernet0/1
 no shutdown
 description TO_R27_E0_0
 ip address 10.254.0.45 255.255.255.252
!
interface Ethernet0/2
 no shutdown
 description TO_R26_E0_2
 ip address 10.254.0.33 255.255.255.252
!
interface Ethernet0/3
 no shutdown
 description TO_R28_E0_1
 ip address 10.254.0.49 255.255.255.252
!
interface Ethernet1/0
 no shutdown
 no ip address
 shutdown
!
interface Ethernet1/1
 no shutdown
 no ip address
 shutdown
!
interface Ethernet1/2
 no shutdown
 no ip address
 shutdown
!
interface Ethernet1/3
 no shutdown
 no ip address
 shutdown
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip route 10.30.10.0 255.255.255.0 Ethernet0/3 10.254.0.50 track 28
ip route 10.30.20.0 255.255.255.0 Ethernet0/3 10.254.0.50 track 28
ip route 10.30.99.0 255.255.255.0 Ethernet0/3 10.254.0.50 track 28
ip route 10.255.0.28 255.255.255.255 Ethernet0/3 10.254.0.50 track 28
ip route 10.30.10.0 255.255.255.0 Ethernet0/2 10.254.0.34 10 track 29
ip route 10.30.20.0 255.255.255.0 Ethernet0/2 10.254.0.34 10 track 29
ip route 10.30.99.0 255.255.255.0 Ethernet0/2 10.254.0.34 10 track 29
ip route 10.255.0.28 255.255.255.255 Ethernet0/2 10.254.0.34 10 track 29
ip route 10.254.0.50 255.255.255.255 Ethernet0/3 10.254.0.50
ip route 10.254.0.50 255.255.255.255 Null0 254
ip route 10.254.0.52 255.255.255.252 Ethernet0/2 10.254.0.34
ip route 10.254.0.54 255.255.255.255 Ethernet0/2 10.254.0.34
ip route 10.254.0.54 255.255.255.255 Null0 254
ip route 10.255.0.26 255.255.255.255 Ethernet0/2 10.254.0.34
ip route 10.255.0.27 255.255.255.255 Ethernet0/1 10.254.0.46
!
ip sla 28
 icmp-echo 10.254.0.50 source-interface Ethernet0/3
 threshold 500
 timeout 1000
 frequency 5
ip sla schedule 28 life forever start-time now
ip sla 29
 icmp-echo 10.254.0.54 source-interface Ethernet0/2
 threshold 500
 timeout 1000
 frequency 5
ip sla schedule 29 life forever start-time now
!
!
!
control-plane
!
!
!
!
!
!
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login
 transport input none

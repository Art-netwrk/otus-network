
!
version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R28
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!


!
!
!
!
no ip domain lookup
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
redundancy
!
!
track 25 ip sla 25 reachability
 delay down 5 up 10
!
track 26 ip sla 26 reachability
 delay down 5 up 10
!
! 
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 no shutdown
 description MANAGEMENT_ROUTER_ID
 ip address 10.255.0.28 255.255.255.255
!
interface Ethernet0/0
 no shutdown
 description TO_R26_E0_1
 ip address 10.254.0.54 255.255.255.252
!
interface Ethernet0/1
 no shutdown
 description TO_R25_E0_3
 ip address 10.254.0.50 255.255.255.252
!
interface Ethernet0/2
 no shutdown
 description TRUNK_TO_SW29_E0_2
 no ip address
!
interface Ethernet0/2.10
 no shutdown
 description VLAN_10_TO_SW29
 encapsulation dot1Q 10
 ip address 10.30.10.1 255.255.255.0
 ip policy route-map CHOK-PBR
!
interface Ethernet0/2.20
 no shutdown
 description VLAN_20_TO_SW29
 encapsulation dot1Q 20
 ip address 10.30.20.1 255.255.255.0
 ip policy route-map CHOK-PBR
!
interface Ethernet0/2.99
 no shutdown
 description VLAN_99_TO_SW29
 encapsulation dot1Q 99
 ip address 10.30.99.1 255.255.255.0
!
interface Ethernet0/2.1000
 no shutdown
 description UNUSED_NATIVE_VLAN
 encapsulation dot1Q 1000 native
!
interface Ethernet0/3
 no shutdown
 no ip address
 shutdown
!
interface Ethernet1/0
 no shutdown
 no ip address
 shutdown
!
interface Ethernet1/1
 no shutdown
 no ip address
 shutdown
!
interface Ethernet1/2
 no shutdown
 no ip address
 shutdown
!
interface Ethernet1/3
 no shutdown
 no ip address
 shutdown
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip route 0.0.0.0 0.0.0.0 Ethernet0/1 10.254.0.49 track 25
ip route 0.0.0.0 0.0.0.0 Ethernet0/0 10.254.0.53 10 track 26
ip route 10.255.0.25 255.255.255.255 Ethernet0/1 10.254.0.49
ip route 10.255.0.25 255.255.255.255 Null0 254
ip route 10.255.0.26 255.255.255.255 Ethernet0/0 10.254.0.53
ip route 10.255.0.26 255.255.255.255 Null0 254
!
ip access-list standard CHOK-VLAN10
 permit 10.30.10.0 0.0.0.255
ip access-list standard CHOK-VLAN20
 permit 10.30.20.0 0.0.0.255
!
ip access-list extended CHOK-LOCAL
 permit ip any 10.30.10.0 0.0.0.255
 permit ip any 10.30.20.0 0.0.0.255
 permit ip any 10.30.99.0 0.0.0.255
 permit ip any host 10.255.0.28
!
ip sla 25
 icmp-echo 10.255.0.25 source-interface Ethernet0/1
 threshold 500
 timeout 1000
 frequency 5
ip sla schedule 25 life forever start-time now
ip sla 26
 icmp-echo 10.255.0.26 source-interface Ethernet0/0
 threshold 500
 timeout 1000
 frequency 5
ip sla schedule 26 life forever start-time now
!
route-map CHOK-PBR deny 5
 match ip address CHOK-LOCAL
!
route-map CHOK-PBR permit 10
 match ip address CHOK-VLAN10
 set ip next-hop verify-availability 10.254.0.49 10 track 25
 set ip next-hop verify-availability 10.254.0.53 20 track 26
!
route-map CHOK-PBR permit 20
 match ip address CHOK-VLAN20
 set ip next-hop verify-availability 10.254.0.53 10 track 26
 set ip next-hop verify-availability 10.254.0.49 20 track 25
!
route-map CHOK-PBR permit 100
!
!
!
control-plane
!
!
!
!
!
!
!
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login
 transport input none
!
!
end
